[package]
name = "cinder"
version = "0.1.0"
edition = "2021"
description = "The experimental Cinder native programming language compiler"
license = "MIT"
default-run = "cinder"

[lib]
name = "cinder"
path = "src/lib.rs"

[[bin]]
name = "cinder"
path = "src/main.rs"

[[bin]]
name = "cinderun"
path = "src/cinderun.rs"
