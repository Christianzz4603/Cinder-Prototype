name: Build Native Stress Library
on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Generated functions (100-12000)"
        required: true
        default: "12000"
        type: string
      rounds:
        description: "Rounds per function (8-96)"
        required: true
        default: "96"
        type: string
permissions:
  contents: write
concurrency:
  group: native-stress-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate C++ source
        env:
          FUNCTIONS: ${{ inputs.functions }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          python - <<'PY'
          import os
          f,r=int(os.environ["FUNCTIONS"]),int(os.environ["ROUNDS"])
          if not 100<=f<=12000: raise SystemExit("functions must be 100..12000")
          if not 8<=r<=96: raise SystemExit("rounds must be 8..96")
          PY
          python scripts/generate_stress.py --functions "$FUNCTIONS" --rounds "$ROUNDS"
          du -sh generated-src
      - name: Commit generated source shards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-src/
          if ! git diff --cached --quiet; then
            git commit -m "test: generate native stress benchmark sources"
            git push origin HEAD:main
          fi
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Generate 96 MiB payload for large-file testing
        run: |
          mkdir -p build
          python - <<'PY'
          import os
          path="build/payload.bin"
          remaining=96*1024*1024
          with open(path,"wb") as out:
              while remaining:
                  chunk=os.urandom(min(1024*1024,remaining))
                  out.write(chunk)
                  remaining-=len(chunk)
          print("Payload bytes:",os.path.getsize(path))
          PY
      - name: Compile Android ARM64 library
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          export CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          mkdir -p build/obj dist
          find generated-src -maxdepth 1 \( -name '*.cpp' -o -name '*.S' \) -print0 |
            xargs -0 -n1 -P2 bash -c '
              set -e
              src="$1"
              base=$(basename "$src" | sed "s/[.][^.]*$//")
              obj="build/obj/$base.o"
              "$CXX" -O2 -fno-inline -fPIC -fvisibility=hidden -fno-exceptions -fno-rtti -c "$src" -o "$obj"
            ' _
          "$CXX" -shared -Wl,--no-gc-sections -Wl,--build-id=none build/obj/*.o -o dist/libnative_stress.so
          "$STRIP" --strip-unneeded dist/libnative_stress.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h dist/libnative_stress.so
          stat -c 'Library size: %s bytes' dist/libnative_stress.so
          sha256sum dist/libnative_stress.so | tee dist/SHA256SUMS.txt
          printf 'functions=%s\nrounds=%s\npayload_mib=96\n' "${{ inputs.functions }}" "${{ inputs.rounds }}" > dist/BUILD-MANIFEST.txt
      - name: Store compiled library in repository or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SIZE=$(stat -c '%s' dist/libnative_stress.so)
          SAFE_LIMIT=$((90 * 1024 * 1024))
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$SIZE" -lt "$SAFE_LIMIT" ]; then
            mkdir -p build
            cp dist/libnative_stress.so build/libnative_stress.so
            git add build/libnative_stress.so
            git commit -m "build: add native stress shared library"
            git push origin HEAD:main
          else
            TAG="native-stress-${GITHUB_RUN_ID}"
            gh release create "$TAG" dist/libnative_stress.so dist/SHA256SUMS.txt dist/BUILD-MANIFEST.txt \
              --title "Native stress library ${GITHUB_RUN_ID}" \
              --notes "ARM64 analysis benchmark with a 96 MiB data section. Source shards are committed to main. Binary is a release asset because ordinary Git files have a 100 MB limit."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-stress-library
          path: dist/
          if-no-files-found: error
          retention-days: 30
