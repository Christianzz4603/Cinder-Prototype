name: Cinder CI

on:
  push:
    branches: [main, "cinder/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install native compiler
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Test compiler
        run: cargo test --all-targets
      - name: Build every Cinder example
        run: |
          set -eu
          for source in examples/*.cind; do
            name="$(basename "$source" .cind)"
            cargo run -- build "$source" -o "/tmp/cinder-$name"
          done
      - name: Run native examples
        run: |
          set -eu
          test "$(/tmp/cinder-hello | head -n 1)" = "Hello from Cinder!"
          /tmp/cinder-variables
          /tmp/cinder-control_flow
          test "$(/tmp/cinder-for_loops)" = "10"
          test "$(/tmp/cinder-loops | tail -n 1)" = "55"
          test "$(/tmp/cinder-functions | tail -n 2 | head -n 1)" = "144"
          test "$(/tmp/cinder-functions | tail -n 1)" = "120"
          output="$(printf 'Cinder\n' | /tmp/cinder-standard_library)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fq 'Hello, Cinder'
          printf '%s\n' "$output" | grep -Fq 'Passed: true'
          printf '%s\n' "$output" | grep -Fq 'Even score: false'
          printf '%s\n' "$output" | grep -Fq 'You found the language name!'
